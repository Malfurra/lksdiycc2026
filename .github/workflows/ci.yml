          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set timestamp tag
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TS=$(date -u +"%Y-%m-%d-%H-%M-%S")
          echo "image=ghcr.io/${REPO_LOWER}:llm-webhook-${TS}" >> $GITHUB_OUTPUT

      - name: Build and push LLM Webhook Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./llm-integrate-sns
          push: true
          tags: ${{ steps.meta.outputs.image }}

  build-example-dataset-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate dataset and zip raw-data
        run: |
          pip install pandas numpy faker
          if [ -f dataset/requirements.txt ];
